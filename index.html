<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud IDS Monitoring Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #13072e 0%, #06112a 100%);
            --card-bg: rgba(20, 25, 45, 0.4);
            --card-border: rgba(0, 212, 255, 0.2);
            --neon-cyan: #00d4ff;
            --neon-cyan-glow: 0 0 10px rgba(0, 212, 255, 0.5);
            --text-main: #e0e5ff;
            --text-muted: #8b96b8;
            --critical: #ff3366;
            --warning: #ffcc00;
            --info: #33ccff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: var(--neon-cyan-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: var(--neon-cyan-glow);
            animation: pulse 2s infinite;
        }

        button.export-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 0 rgba(0, 212, 255, 0);
        }

        button.export-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.5), 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        /* Stats Section */
        .stats-container {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 24px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--neon-cyan-glow);
        }

        /* Left Column: Feed */
        .alerts-feed-container {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 60vh;
        }

        .alerts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .alerts-list {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        .alerts-list::-webkit-scrollbar {
            width: 6px;
        }
        .alerts-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .alerts-list::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }

        .alert-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--info);
            padding: 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateX(-50px);
        }

        .alert-card.critical { border-left-color: var(--critical); }
        .alert-card.warning { border-left-color: var(--warning); }
        
        .alert-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert-title {
            font-weight: 600;
            font-size: 15px;
        }
        .alert-card.critical .alert-title { color: var(--critical); }
        .alert-card.warning .alert-title { color: var(--warning); }
        .alert-card.info .alert-title { color: var(--info); }

        .alert-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .alert-time {
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        /* Right Column: Charts & Geo */
        .analytics-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-container, .geo-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            color: var(--text-main);
        }

        .bar-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .bar-track {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--neon-cyan);
            border-radius: 4px;
            transition: width 0.5s ease-in-out;
            box-shadow: var(--neon-cyan-glow);
        }

        .geo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .geo-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
        }

        .geo-country {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .geo-count {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Animations */
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .alerts-feed-container {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cloud IDS Engine</h1>
        <button class="export-btn" onclick="exportData()">Export Report (JSON)</button>
    </header>

    <div class="dashboard-grid">
        <!-- Stats Section -->
        <div class="stats-container">
            <div class="glass stat-card">
                <h3>Total Threats Detected</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="glass stat-card">
                <h3>Active Alerts</h3>
                <div class="value" id="stat-active" style="color: var(--warning); text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);">0</div>
            </div>
            <div class="glass stat-card">
                <h3>Blocked IPs</h3>
                <div class="value" id="stat-blocked" style="color: var(--critical); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);">0</div>
            </div>
        </div>

        <!-- Left Column: Alerts Feed -->
        <div class="glass alerts-feed-container">
            <div class="alerts-header">
                <h2>Real-Time Threat Feed</h2>
                <div id="status-indicator" style="font-size: 12px; color: var(--neon-cyan);">Connecting...</div>
            </div>
            <div class="alerts-list" id="alerts-list">
                <!-- Alerts injected here -->
            </div>
        </div>

        <!-- Right Column: Analytics & Geo -->
        <div class="analytics-container">
            <div class="glass chart-container">
                <h2>Attack Type Distribution</h2>
                <div id="attack-distribution">
                    <!-- Bars injected here -->
                </div>
            </div>
            
            <div class="glass geo-container">
                <h2>Geographic Threat Sources</h2>
                <div class="geo-list" id="geo-list">
                    <!-- Geo items injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Structures & State
        const state = {
            total: 0,
            active: 0,
            blocked: 0,
            alerts: [],
            attackTypes: {
                "DDoS Attempt": 0,
                "SQL Injection": 0,
                "Cross-Site Scripting (XSS)": 0,
                "Brute Force": 0,
                "Port Scan": 0,
                "Malware": 0 // Added Malware
            },
            geoSources: {
                "Mumbai": 0,
                "Delhi": 0,
                "Bengaluru": 0,
                "Chennai": 0,
                "Hyderabad": 0,
                "Pune": 0,
                "Kolkata": 0
            }
        };

        // Constants for Simulation (Fallback)
        const severities = ["critical", "warning", "info"];
        const attackTypesArr = Object.keys(state.attackTypes);
        const geoSourcesArr = Object.keys(state.geoSources);

        // Utility to generate random IP
        function getRandomIP() {
            return `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        }

        // Generate a new threat alert (Simulation Fallback)
        function generateThreat() {
            const type = attackTypesArr[Math.floor(Math.random() * attackTypesArr.length)];
            const geo = geoSourcesArr[Math.floor(Math.random() * geoSourcesArr.length)];
            
            // Bias severity based on type
            let severity = "info";
            if (type === "DDoS Attempt" || type === "SQL Injection" || type === "Malware") severity = Math.random() > 0.3 ? "critical" : "warning";
            else if (type === "Brute Force") severity = "warning";
            else severity = severities[Math.floor(Math.random() * severities.length)];

            const alert = {
                id: `ALRT-${Math.random().toString(36).substr(2, 6).toUpperCase()}`,
                timestamp: new Date().toISOString(),
                type: type,
                source_ip: getRandomIP(), // Updated to source_ip
                geo: geo,
                severity: severity,
                action: severity === "critical" ? "Blocked" : "Logged",
                description: `Simulated ${type} from ${geo}` // Added description
            };

            processAlert(alert, true);
        }

        // Fetch data from Flask backend
        async function fetchFromBackend() {
            try {
                const statusIndicator = document.getElementById('status-indicator');
                
                // Fetch stats from backend
                const statsRes = await fetch('http://127.0.0.1:5000/api/stats');
                if (!statsRes.ok) throw new Error(`HTTP error! status: ${statsRes.status}`);
                const backendStats = await statsRes.json();
                
                // Fetch new alerts from backend
                const alertsRes = await fetch('http://127.0.0.1:5000/api/alerts');
                if (!alertsRes.ok) throw new Error(`HTTP error! status: ${alertsRes.status}`);
                const backendAlerts = await alertsRes.json();

                // If successful, update status indicator
                statusIndicator.innerText = "Live Monitoring Active (Backend)";
                statusIndicator.style.color = "#00ff00";

                // Update global state with backend stats
                state.total = backendStats.total;
                state.active = backendStats.active;
                state.blocked = backendStats.blocked;
                state.attackTypes = backendStats.attackTypes;
                state.geoSources = backendStats.geoSources;

                // Sync UI counters and charts
                updateCounters();
                updateCharts();
                updateGeoList();

                // Process backend alerts (false = don't double count local stats)
                backendAlerts.forEach(alert => {
                    processAlert(alert, false);
                });

            } catch (error) {
                console.warn("Backend unavailable, falling back to simulation:", error);
                
                // Update status indicator for simulation mode
                const statusIndicator = document.getElementById('status-indicator');
                statusIndicator.innerText = "Live Monitoring Active (Simulation Mode)";
                statusIndicator.style.color = "var(--warning)";
                
                // Generate a simulated threat
                generateThreat();
            }
        }

        // Process new alert and update state/UI
        function processAlert(alert, updateLocalStats = true) {
            // Update State History
            state.alerts.unshift(alert);
            if (state.alerts.length > 200) state.alerts.pop(); // keep memory in check

            if (updateLocalStats) {
                state.total++;
                if (alert.severity === "critical" || alert.severity === "warning") state.active++;
                if (alert.action === "Blocked") state.blocked++;

                if(state.attackTypes[alert.type] !== undefined) state.attackTypes[alert.type]++;
                else state.attackTypes[alert.type] = 1;

                if(state.geoSources[alert.geo] !== undefined) state.geoSources[alert.geo]++;
                else state.geoSources[alert.geo] = 1;
                
                updateCounters();
                updateCharts();
                updateGeoList();
            }

            // Update UI feed
            renderAlert(alert);
        }

        function updateCounters() {
            document.getElementById("stat-total").innerText = state.total.toLocaleString();
            document.getElementById("stat-active").innerText = state.active.toLocaleString();
            document.getElementById("stat-blocked").innerText = state.blocked.toLocaleString();
        }

        function renderAlert(alert) {
            const list = document.getElementById("alerts-list");
            const timeStr = new Date(alert.timestamp).toLocaleTimeString();
            
            const card = document.createElement("div");
            card.className = `alert-card ${alert.severity}`;
            
            card.innerHTML = `
                <div class="alert-content">
                    <div class="alert-title">${alert.type}</div>
                    <div class="alert-meta">
                        <span>Source: ${alert.source_ip || alert.ip}</span>
                        <span>Geo: ${alert.geo}</span>
                        <span>Action: ${alert.action}</span>
                    </div>
                    ${alert.description ? `<div class="alert-meta" style="margin-top: 5px; color: var(--text-main); font-size: 11px;">Desc: ${alert.description}</div>` : ''}
                </div>
                <div class="alert-time">${timeStr}</div>
            `;
            
            list.insertBefore(card, list.firstChild);
            
            // Limit DOM nodes
            if (list.children.length > 50) {
                list.removeChild(list.lastChild);
            }
        }

        function updateCharts() {
            const container = document.getElementById("attack-distribution");
            container.innerHTML = ""; 

            const max = Math.max(...Object.values(state.attackTypes), 1);

            Object.entries(state.attackTypes)
                .sort((a, b) => b[1] - a[1]) // Sort descending
                .forEach(([type, count]) => {
                    const percentage = (count / max) * 100;
                    
                    const barRow = document.createElement("div");
                    barRow.className = "bar-row";
                    barRow.innerHTML = `
                        <div class="bar-labels">
                            <span>${type}</span>
                            <span>${count}</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                    `;
                    container.appendChild(barRow);
                });
        }

        function updateGeoList() {
            const container = document.getElementById("geo-list");
            container.innerHTML = "";

            Object.entries(state.geoSources)
                .filter(([_, count]) => count > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5) // Top 5
                .forEach(([country, count]) => {
                    const item = document.createElement("div");
                    item.className = "geo-item";
                    item.innerHTML = `
                        <div class="geo-country">
                            <span>📍</span> ${country}
                        </div>
                        <div class="geo-count">${count}</div>
                    `;
                    container.appendChild(item);
                });
        }

        // Export Functionality
        function exportData() {
            const dataStr = JSON.stringify({
                summary: {
                    totalThreats: state.total,
                    activeAlerts: state.active,
                    blockedIPs: state.blocked,
                    attackTypes: state.attackTypes,
                    geoSources: state.geoSources,
                    generatedAt: new Date().toISOString()
                },
                alertsLog: state.alerts
            }, null, 2);

            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = `cloud-ids-report-${new Date().getTime()}.json`;
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize and start simulation
        function init() {
            // Initial fetch
            fetchFromBackend();
            
            // Start the 5-second interval
            setInterval(fetchFromBackend, 5000);
        }

        // Start
        window.onload = init;
    </script>
</body>
</html>
